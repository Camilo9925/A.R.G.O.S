# Ambiente completo do ARGOS (Art. II.6, XII.7; plan 7.2). Uso: cp .env.example .env && docker compose up --build
# Ordem de subida: db → migrator → api → simulator e web.

name: argos

# Autenticação por senha; a negociação GSS/Kerberos fica desligada (a biblioteca nativa não existe nas imagens .NET).
x-connection-string: &connection-string "Host=db;Port=5432;Database=${POSTGRES_DB:?Defina POSTGRES_DB no .env};Username=${POSTGRES_USER:?Defina POSTGRES_USER no .env};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env};Gss Encryption Mode=Disable"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - argos-pgdata:/var/lib/postgresql/data
    # Só no localhost do host, para ferramentas locais; a porta muda pelo .env sem afetar os outros serviços.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    build:
      context: .
      dockerfile: src/Argos.Migrator/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Demo
      ConnectionStrings__Argos: *connection-string
      Simulation__Seed: ${SIMULATION_SEED:-42}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/Argos.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__Argos: *connection-string
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: src/Argos.Simulator/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      Simulation__Seed: ${SIMULATION_SEED:-42}
      Simulator__HeartbeatIntervalSeconds: ${HEARTBEAT_INTERVAL_SECONDS:-5}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Argos.Web/Dockerfile
    ports:
      - "8080:80"
    healthcheck:
      # 127.0.0.1 em vez de localhost: no Alpine, localhost pode resolver para IPv6, onde o nginx não escuta.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  argos-pgdata:
