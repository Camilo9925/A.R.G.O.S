# Web do ARGOS (plan 7.1, 7.2): serve o Blazor WebAssembly e faz proxy reverso de /api, /hubs e /health para a API.
# Mesma origem para o navegador, então não há CORS (D-29). Só HTTP (D-14).

# Upgrade de WebSocket só quando o cliente pede; nas demais requisições a conexão é encerrada normalmente.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker, consultado de novo a cada 10 s: se o contêiner da API reiniciar com outro IP, o proxy acompanha.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Compressão: os arquivos já comprimidos na publicação (.gz) são servidos direto; o resto é comprimido na hora.
    # application/json inclui o mapa base (data/streets.json, D-08) e o appsettings.json.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

    # Sempre revalidar (ETag/Last-Modified): uma nova versão da Web aparece sem limpar o cache do navegador.
    add_header Cache-Control "no-cache" always;

    location / {
        # Rotas do Blazor caem no index.html.
        try_files $uri $uri/ /index.html;
    }

    # Arquivos do runtime com impressão digital no nome: o conteúdo nunca muda para o mesmo nome.
    location ~ "^/_framework/.+\.[0-9a-z]{10}\.(js|wasm|dat|json)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hub SignalR: WebSocket com upgrade e conexões longas.
    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /health/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
}
